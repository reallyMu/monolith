name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Install clipper deps
        run: npm --prefix extensions/monolith-clipper ci

      - name: Fetch downmark (Windows)
        shell: bash
        run: bash scripts/install-converters.sh

      - name: Build Tauri (NSIS installer)
        run: npm run tauri build -- --bundles nsis

      - name: Locate installer
        id: artifact
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found" }
          Write-Host "Found $($nsis.FullName) ($([math]::Round($nsis.Length/1MB, 2)) MB)"
          "path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($nsis.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: monolith-windows-nsis
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $asset = "${{ steps.artifact.outputs.path }}"
          if ($env:GITHUB_REF.StartsWith("refs/tags/")) {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v0.2.0"
          }
          $null = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Monolith $tag" --notes "Windows build for $tag" --latest=false
          }
          gh release upload $tag $asset --clobber
          Write-Host "Uploaded $asset to release $tag"