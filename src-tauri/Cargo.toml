[package]
name = "monolith"
version = "0.2.0"
description = "Monolith — local Monaco text editor"
authors = ["muqiang"]
edition = "2021"
default-run = "monolith"

[lib]
name = "monolith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Implicit bin `monolith` from src/main.rs (default-run).
[[bin]]
name = "monolith-mcp"
path = "src/bin/monolith_mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
